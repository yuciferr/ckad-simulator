apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-23-api
  namespace: pluto
  labels:
    app: project-23-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: project-23-api
  template:
    metadata:
      labels:
        app: project-23-api
    spec:
      containers:
      - name: httpd
        image: httpd:2.4-alpine
        ports:
        - containerPort: 80
