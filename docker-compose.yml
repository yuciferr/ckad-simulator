x-build-args: &build-args
  TARGETARCH: ${TARGETARCH:-amd64}

services:
  # One-shot job: creates the kind cluster and publishes its kubeconfig on a
  # shared volume, then exits. The backend will not start until it succeeds.
  kind-init:
    build:
      context: .
      dockerfile: docker/kind-init.Dockerfile
      args: *build-args
    image: ckad-simulator-kind-init:latest
    container_name: ckad-kind-init
    volumes:
      # kind drives the host's Docker daemon to create the cluster container,
      # so this one genuinely needs the socket.
      - /var/run/docker.sock:/var/run/docker.sock
      - kind-kubeconfig:/etc/kind
    environment:
      KIND_CLUSTER_NAME: ckad-simulator
      KUBECONFIG_OUTPUT: /etc/kind/kubeconfig
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args: *build-args
    image: ckad-simulator-backend:latest
    container_name: ckad-backend
    # Every question tab forks a bash PTY. Without an init as PID 1 those
    # exited shells stay as zombies for the life of the container.
    init: true
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - kind-kubeconfig:/etc/kind:ro
      # Bind-mounted so exam content and scripts can be edited without a
      # rebuild; both are also baked into the image for standalone `docker run`.
      - ./exams:/app/exams:ro
      - ./scripts:/app/scripts:ro
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      KUBECONFIG: /etc/kind/kubeconfig
      KIND_CLUSTER_NAME: ckad-simulator
      SANDBOX_MODE: kind
      NODE_ENV: production
    depends_on:
      kind-init:
        condition: service_completed_successfully
    restart: unless-stopped
    # The backend talks to the cluster over the Kubernetes API only — it never
    # shells out to docker — so it gets no socket and cannot gain privileges.
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kind-kubeconfig:

networks:
  default:
    name: ckad-network
