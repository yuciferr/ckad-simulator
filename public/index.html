<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CKAD Simulator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- ═══ Landing Screen ═══ -->
  <div id="landing" class="screen active">
    <div class="landing-header">
      <div class="logo">CKAD SIMULATOR</div>
      <div class="subtitle">Certified Kubernetes Application Developer — Practice Environment</div>
    </div>
    <div class="exam-list" id="examList">
      <div class="loading">Loading exams...</div>
    </div>
  </div>

  <!-- ═══ Exam Screen ═══ -->
  <div id="exam" class="screen">
    <!-- Top Bar -->
    <div class="topbar">
      <div class="topbar-left">
        <span class="topbar-logo">CKAD SIMULATOR</span>
        <span class="topbar-sep">|</span>
        <span class="topbar-exam-title" id="examTitle"></span>
      </div>
      <div class="topbar-center">
        <button class="nav-btn" id="btnPrev">← Prev</button>
        <div class="question-dropdown">
          <button class="nav-btn dropdown-toggle" id="btnQuestionList">
            Question <span id="currentQNum">1</span> of <span id="totalQNum">0</span> ▾
          </button>
          <div class="dropdown-menu" id="questionDropdown"></div>
        </div>
        <button class="nav-btn" id="btnNext">Next →</button>
      </div>
      <div class="topbar-right">
        <div class="timer" id="timer">02:00:00</div>
        <button class="btn-end" id="btnEndExam">End Exam</button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Left Panel: Questions -->
      <div class="panel-left" id="panelLeft">
        <div class="panel-tabs">
          <button class="panel-tab active" data-tab="question">Question</button>
          <button class="panel-tab" data-tab="notepad">Notepad</button>
        </div>

        <div class="tab-content active" id="tabQuestion">
          <div class="question-header">
            <span class="question-weight" id="questionWeight">Weight: 0%</span>
            <button class="btn-flag" id="btnFlag">⚑ Flag</button>
          </div>
          <div class="question-context" id="questionContext"></div>
          <div class="question-body" id="questionBody"></div>
        </div>

        <div class="tab-content" id="tabNotepad">
          <textarea class="notepad" id="notepad" placeholder="Use this notepad to take notes during the exam..."></textarea>
        </div>

        <div class="panel-footer">
          <button class="btn-satisfied" id="btnSatisfied">I am satisfied, next →</button>
        </div>
      </div>

      <!-- Resizer -->
      <div class="resizer" id="resizer"></div>

      <!-- Right Panel: Terminal -->
      <div class="panel-right" id="panelRight">
        <div class="panel-tabs">
          <button class="panel-tab active">Terminal</button>
        </div>
        <div class="terminal-container" id="terminalContainer"></div>
      </div>
    </div>
  </div>

  <!-- ═══ Review Screen ═══ -->
  <div id="review" class="screen">
    <div class="topbar">
      <div class="topbar-left">
        <span class="topbar-logo">CKAD SIMULATOR</span>
        <span class="topbar-sep">|</span>
        <span>Review Mode</span>
      </div>
      <div class="topbar-center">
        <button class="nav-btn" id="btnReviewPrev">← Prev</button>
        <div class="question-dropdown">
          <button class="nav-btn dropdown-toggle" id="btnReviewQuestionList">
            Question <span id="reviewQNum">1</span> of <span id="reviewTotalQNum">0</span> ▾
          </button>
          <div class="dropdown-menu" id="reviewQuestionDropdown"></div>
        </div>
        <button class="nav-btn" id="btnReviewNext">Next →</button>
      </div>
      <div class="topbar-right">
        <div class="score-display">Score: <span id="scoreDisplay">0</span>%</div>
        <button class="btn-end" id="btnBackToHome">Back to Home</button>
      </div>
    </div>

    <div class="review-content">
      <div class="review-left">
        <h3 class="review-section-title">Question</h3>
        <div class="review-question" id="reviewQuestionBody"></div>
        <h3 class="review-section-title">Scoring Criteria</h3>
        <div class="review-criteria" id="reviewCriteria"></div>
      </div>
      <div class="review-right">
        <h3 class="review-section-title">Solution</h3>
        <div class="review-answer" id="reviewAnswerBody"></div>
      </div>
    </div>
  </div>

  <!-- ═══ Confirm Modal ═══ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-title" id="modalTitle">End Exam?</div>
      <div class="modal-body" id="modalBody">Are you sure you want to end the exam? You will enter review mode.</div>
      <div class="modal-actions">
        <button class="btn-cancel" id="modalCancel">Cancel</button>
        <button class="btn-confirm" id="modalConfirm">Confirm</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
