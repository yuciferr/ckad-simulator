# Q5 — NetworkPolicy for backend pod
apiVersion: v1
kind: Namespace
metadata:
  name: exam-q5
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: exam-q5
  labels:
    app: frontend
spec:
  containers:
    - name: nginx
      image: nginx:1.25
      ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: exam-q5
  labels:
    app: backend
spec:
  containers:
    - name: nginx
      image: nginx:1.25
      ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: database
  namespace: exam-q5
  labels:
    app: database
spec:
  containers:
    - name: db
      image: busybox:1.36
      command: ["sleep", "3600"]
