# Q11 — Ingress routing to two services
apiVersion: v1
kind: Namespace
metadata:
  name: exam-q11
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deploy
  namespace: exam-q11
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app-svc
  namespace: exam-q11
spec:
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deploy
  namespace: exam-q11
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: exam-q11
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
