# Question 1 — fix liveness probe on pod1
apiVersion: v1
kind: Namespace
metadata:
  name: exam-q1
---
apiVersion: v1
kind: Pod
metadata:
  name: pod1
  namespace: exam-q1
  labels:
    app: pod1
spec:
  containers:
    - name: nginx
      image: nginx:1.25
      ports:
        - containerPort: 80
      livenessProbe:
        httpGet:
          path: /this-does-not-exist
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 3
