apiVersion: apps/v1
kind: Deployment
metadata:
  name: webchart
  labels:
    app: webchart
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: webchart
  template:
    metadata:
      labels:
        app: webchart
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
