# Q17 — client / api / db Pods for the NetworkPolicy task
apiVersion: v1
kind: Namespace
metadata:
  name: exam-q17
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: exam-q17
  labels:
    app: client
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: exam-q17
  labels:
    app: api
spec:
  containers:
    - name: c
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: db
  namespace: exam-q17
  labels:
    app: db
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
