# Q15 — scaler-app Deployment with a CPU request (HPA target)
apiVersion: v1
kind: Namespace
metadata:
  name: exam-q15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaler-app
  namespace: exam-q15
  labels:
    app: scaler-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scaler-app
  template:
    metadata:
      labels:
        app: scaler-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
