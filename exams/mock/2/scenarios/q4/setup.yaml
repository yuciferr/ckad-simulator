# Q4 — blue Deployment + Service currently routing to version=blue
apiVersion: v1
kind: Namespace
metadata:
  name: exam-q4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
  namespace: exam-q4
  labels:
    app: app
    version: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app
      version: blue
  template:
    metadata:
      labels:
        app: app
        version: blue
    spec:
      containers:
        - name: nginx
          image: nginx:1.24-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app-svc
  namespace: exam-q4
spec:
  selector:
    app: app
    version: blue
  ports:
    - port: 80
      targetPort: 80
