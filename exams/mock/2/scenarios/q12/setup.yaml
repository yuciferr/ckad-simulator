# Q12 — ResourceQuota constraining CPU/memory in the namespace
apiVersion: v1
kind: Namespace
metadata:
  name: exam-q12
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
  namespace: exam-q12
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
