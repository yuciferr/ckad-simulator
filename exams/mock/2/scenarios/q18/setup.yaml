# Q18 — web-svc + metrics-svc (with backing Deployments) for the Ingress task
apiVersion: v1
kind: Namespace
metadata:
  name: exam-q18
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: exam-q18
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: exam-q18
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics
  namespace: exam-q18
  labels:
    app: metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics
  template:
    metadata:
      labels:
        app: metrics
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-svc
  namespace: exam-q18
spec:
  selector:
    app: metrics
  ports:
    - port: 9090
      targetPort: 80
