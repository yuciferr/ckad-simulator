# Q3 — frontend Deployment to configure rolling update + image bump
apiVersion: v1
kind: Namespace
metadata:
  name: exam-q3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: exam-q3
  labels:
    app: frontend
spec:
  replicas: 6
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:1.24-alpine
          ports:
            - containerPort: 80
