# Q8 — data-processor Deployment intentionally broken (bad command -> CrashLoopBackOff)
apiVersion: v1
kind: Namespace
metadata:
  name: exam-q8
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-processor
  namespace: exam-q8
  labels:
    app: data-processor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: data-processor
  template:
    metadata:
      labels:
        app: data-processor
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "processs-data --forever"]
