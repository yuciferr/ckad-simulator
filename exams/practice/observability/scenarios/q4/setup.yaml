# Q4 — pods with failing liveness probes across multiple namespaces
apiVersion: v1
kind: Namespace
metadata:
  name: qa
---
apiVersion: v1
kind: Namespace
metadata:
  name: alan
---
apiVersion: v1
kind: Namespace
metadata:
  name: test
---
apiVersion: v1
kind: Namespace
metadata:
  name: production
---
apiVersion: v1
kind: Pod
metadata:
  name: web-qa
  namespace: qa
  labels:
    app: web
spec:
  containers:
    - name: nginx
      image: nginx:1.25-alpine
      livenessProbe:
        exec:
          command: ['sh', '-c', 'exit 1']
        initialDelaySeconds: 2
        periodSeconds: 5
---
apiVersion: v1
kind: Pod
metadata:
  name: web-alan
  namespace: alan
  labels:
    app: web
spec:
  containers:
    - name: nginx
      image: nginx:1.25-alpine
      livenessProbe:
        exec:
          command: ['sh', '-c', 'exit 1']
        initialDelaySeconds: 2
        periodSeconds: 5
---
apiVersion: v1
kind: Pod
metadata:
  name: web-test
  namespace: test
  labels:
    app: web
spec:
  containers:
    - name: nginx
      image: nginx:1.25-alpine
      livenessProbe:
        exec:
          command: ['sh', '-c', 'exit 1']
        initialDelaySeconds: 2
        periodSeconds: 5
---
apiVersion: v1
kind: Pod
metadata:
  name: web-prod
  namespace: production
  labels:
    app: web
spec:
  containers:
    - name: nginx
      image: nginx:1.25-alpine
      livenessProbe:
        exec:
          command: ['sh', '-c', 'exit 1']
        initialDelaySeconds: 2
        periodSeconds: 5
---
apiVersion: v1
kind: Pod
metadata:
  name: web-prod-ok
  namespace: production
  labels:
    app: web-ok
spec:
  containers:
    - name: nginx
      image: nginx:1.25-alpine
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
